<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Special Instruction | LambdaITSM Wiki</title>

    <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body>

<div class="container">
    <header>
        <a href="/" class="back-link">
            ← Back to Runbooks
        </a>
        <h1>Special Instruction</h1>
        <p>
            Client-Specific Instructions
        </p>
    </header>
    <section class="runbook-meta">

        <div class="meta-item">
            <span class="meta-label">Instruction ID</span>
            <span>{{ instruction.id }}</span>
        </div>

        <div class="meta-item">
            <span class="meta-label">Client ID</span>
            <span>{{ instruction.client_id }}</span>
        </div>

        <div class="meta-item">
            <span class="meta-label">Created At</span>
            <span>{{ instruction.created_at }}</span>
        </div>

    </section>

    <section class="runbook-section warning-section">
        <h2>Instruction</h2>
        <p>{{ instruction.instruction }}</p>
    </section>

</div>
<script src="/static/js/main.js"></script>
</body>
</html>
