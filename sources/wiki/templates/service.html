<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ service.service_name }} | LambdaITSM Wiki</title>

    <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body>

<div class="container">
    <header>
        <a href="/" class="back-link">
            ← Back to Runbooks
        </a>
        <h1>{{ service.service_name }}</h1>
        <p>
            Service
        </p>
    </header>
    <section class="runbook-meta">

        <div class="meta-item">
            <span class="meta-label">Service ID</span>
            <span>{{ service.id }}</span>
        </div>

        <div class="meta-item">
            <span class="meta-label">Client ID</span>
            <span>{{ service.client_id }}</span>
        </div>

        <div class="meta-item">
            <span class="meta-label">Service Name</span>
            <span>{{ service.service_name }}</span>
        </div>

        <div class="meta-item">
            <span class="meta-label">Created At</span>
            <span>{{ service.created_at }}</span>
        </div>

    </section>

</div>
<script src="/static/js/main.js"></script>
</body>
</html>
